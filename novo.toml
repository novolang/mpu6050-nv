[package]
name        = "mpu6050-nv"
version     = "0.2.0"
description = "A driver for TDK InvenSense's MPU-6050 six-axis motion tracking device on an I2C bus: the acceleration in milli-g and the rate of turn in milli-degrees per second at the range and sample rate set, the digital low-pass filter, the power modes and the clock source, the data-ready interrupt, the FIFO, the temperature, the self-tests with their factory trims and WHO_AM_I, as devices-nv's Accelerometer, Gyroscope, Imu, Thermometer and Identifiable."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["mpu6050", "mpu-6050", "imu", "accelerometer", "gyroscope", "i2c", "sensor", "tdk", "invensense", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/mpu6050-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.1"

# The package is checked at the embedded tier, the strictest one, so every
# function in it is also valid at rt and system.
[tier]
tier = "embedded"

[docs.pages]
"README.md" = "Reading an MPU-6050 six-axis IMU from a device program"

[dependencies]
# The board's I2C bus, GPIO and timer handles, and the I2cBus and GpioOut
# traits they implement.
# A path dependency until 0.4.0 is published: PATH-DEPENDENCIES.md in the
# parent directory lists the line that becomes "^0.4.0".
embedded-hal-nv = "^0.4.0"
# The wiring record a board's device table hands `attach`, the register
# helpers, and the Accelerometer, Gyroscope, Imu, Thermometer and
# Identifiable traits.
devices-nv      = "^0.4.0"
